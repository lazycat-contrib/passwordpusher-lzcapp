lzc-sdk-version: "0.1"
name: Password Pusher
package: cloud.lazycat.app.password-pusher
version: 1.5.3
description: Password Pusher
  是一个用来分享密码、文本甚至文件的工具，但它和普通的聊天软件不一样！它会生成一个带加密的“一次性链接”，对方只能在规定的时间内或有限的查看次数中访问。一旦次数用完或时间到期，内容会自动消失，最大限度保护你的隐私。
homepage: https://github.com/pglombardo/PasswordPusher
author: pglombardo
application:
  subdomain: password-pusher
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://pwpush:5100/
services:
  pwpush:
    image: docker.hlmirror.com/pglombardo/pwpush:latest
    environment:
      - DATABASE_URL=sqlite3:///opt/PasswordPusher/data/pwpush.sqlite3
    binds:
      - /lzcapp/var/data:/opt/PasswordPusher/data
    setup_script: |
      mkdir -p /opt/PasswordPusher/data
      chown -R 1000:1000 /opt/PasswordPusher/data
