package: cloud.lazycat.app.password-pusher
version: 2.14.2
name: Password Pusher
description: "Password Pusher 是一个用来分享密码、文本甚至文件的工具，但它和普通的聊天软件不一样！它会生成一个带加密的“一次性链接”，对方只能在规定的时间内或有限的查看次数中访问。一旦次数用完或时间到期，内容会自动消失，最大限度保护你的隐私。"
min_os_version: "1.5.0"
homepage: https://github.com/pglombardo/PasswordPusher
author: pglombardo
locales:
  zh:
    description: "Password Pusher 是一个用来分享密码、文本甚至文件的工具，但它和普通的聊天软件不一样！它会生成一个带加密的“一次性链接”，对方只能在规定的时间内或有限的查看次数中访问。一旦次数用完或时间到期，内容会自动消失，最大限度保护你的隐私。"
    name: Password Pusher
  en:
    description: "Password Pusher is a tool for sharing passwords, text, and even files securely. Unlike ordinary chat apps, it generates encrypted one-time links that recipients can open only within a limited time or a limited number of views. Once the limit is reached, the content disappears automatically, maximizing your privacy."
    name: Password Pusher
